name: Build MCVL Embedded Local Server APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip"
      - ".github/workflows/build-embedded-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          test -f MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip
          unzip -t MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip >/dev/null

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract source
        id: extract
        run: |
          rm -rf source
          mkdir source
          unzip -q MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip -d source
          BUILD_SH=$(find source -type f -name build_apk.sh -print -quit)
          test -n "$BUILD_SH"
          SRC_DIR=$(dirname "$BUILD_SH")
          echo "Source directory: $SRC_DIR"
          echo "src_dir=$SRC_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.extract.outputs.src_dir }}"
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: Verify APK
        run: |
          APK="${{ steps.extract.outputs.src_dir }}/out/MinhChuVoLam-2.0.3.apk"
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCVL-2.0.3-embedded-server
          path: "${{ steps.extract.outputs.src_dir }}/out/MinhChuVoLam-2.0.3.apk"
          if-no-files-found: error
          retention-days: 30
