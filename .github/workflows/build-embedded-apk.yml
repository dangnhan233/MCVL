name: Build MCVL Embedded Local Server APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip"
      - ".github/workflows/build-embedded-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          test -f MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip
          unzip -t MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip >/dev/null

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

      - name: Extract source
        id: extract
        run: |
          rm -rf source
          mkdir source
          unzip -q MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip -d source
          BUILD_SH=$(find source -type f -name build_apk.sh -print -quit)
          test -n "$BUILD_SH"
          SRC_DIR=$(dirname "$BUILD_SH")
          echo "Source directory: $SRC_DIR"
          echo "src_dir=$SRC_DIR" >> "$GITHUB_OUTPUT"

      - name: Inject MCVL server debug logging
        working-directory: source/mcvl-android-source/mcvl-android
        run: |
          DEBUG_DIR=app/src/main/java/com/mcvl/android
          cat > "$DEBUG_DIR/EmbeddedServerDebug.java" <<'EOF'
          package com.mcvl.android;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          final class EmbeddedServerDebug {
              private static Context app;
              private static Uri uri;
              private static Uri rootUri;
              private static String name;

              static synchronized void init(Context context) {
                  if (app != null) return;
                  app = context.getApplicationContext();
                  try {
                      name = "MCVL_SERVER_DEBUG_" +
                              new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) +
                              ".log";
                      ContentResolver cr = app.getContentResolver();
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                      if (Build.VERSION.SDK_INT >= 29) {
                          cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/mcvl_debug");
                          cv.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      }
                      uri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                      ContentValues root = new ContentValues();
                      root.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      root.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                      if (Build.VERSION.SDK_INT >= 29) {
                          root.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download");
                          root.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      }
                      rootUri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, root);
                      if (uri == null) {
                          ContentValues fallback = new ContentValues();
                          fallback.put(MediaStore.MediaColumns.DISPLAY_NAME, "MCVL_SERVER_DEBUG_FALLBACK_" +
                                  new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".log");
                          fallback.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                          if (Build.VERSION.SDK_INT >= 29) {
                              fallback.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download");
                              fallback.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          }
                          uri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, fallback);
                      }
                  } catch (Throwable t) {
                      android.util.Log.e("MCVL_DEBUG", "init failed", t);
                  }
                  log("=== MCVL EMBEDDED SERVER DEBUG START ===");
                  log("android=" + Build.VERSION.RELEASE + " sdk=" + Build.VERSION.SDK_INT);
                  log("endpoint=127.0.0.1:9001");
              }

              static synchronized void log(String message) {
                  String line = System.currentTimeMillis() + " " + message + "\n";
                  android.util.Log.i("MCVL_DEBUG", message);
                  if (app == null || (uri == null && rootUri == null)) {
                      return;
                  }
                  try {
                      if (uri != null) {
                          OutputStream out = app.getContentResolver().openOutputStream(uri, "wa");
                          if (out != null) { out.write(line.getBytes(StandardCharsets.UTF_8)); out.close(); }
                      }
                      if (rootUri != null) {
                          OutputStream out = app.getContentResolver().openOutputStream(rootUri, "wa");
                          if (out != null) { out.write(line.getBytes(StandardCharsets.UTF_8)); out.close(); }
                      }
                  } catch (Throwable t) {
                      android.util.Log.e("MCVL_DEBUG", "write failed: " + line, t);
                  }
              }

              static String hex(byte[] data) {
                  if (data == null) return "";
                  StringBuilder sb = new StringBuilder(data.length * 2);
                  for (byte b : data) sb.append(String.format(Locale.US, "%02X", b & 0xFF));
                  return sb.toString();
              }

              static synchronized void error(String where, Throwable t) {
                  log("ERROR " + where + " " + t.getClass().getName() + ": " + String.valueOf(t.getMessage()));
              }
          }
          EOF

          cat > "$DEBUG_DIR/MCVLChunkInputStream.java" <<'EOF'
          package com.mcvl.android;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;

          final class MCVLChunkInputStream extends InputStream {
              private final InputStream delegate;
              private final String remote;
              private final ByteArrayOutputStream stream = new ByteArrayOutputStream();

              MCVLChunkInputStream(InputStream delegate, String remote) {
                  this.delegate = delegate;
                  this.remote = remote;
              }

              @Override public int read() throws IOException {
                  int b = delegate.read();
                  if (b >= 0) {
                      byte[] one = {(byte)b};
                      record(one, 0, 1);
                  }
                  return b;
              }

              @Override public int read(byte[] b, int off, int len) throws IOException {
                  int n = delegate.read(b, off, len);
                  if (n > 0) record(b, off, n);
                  return n;
              }

              private void record(byte[] b, int off, int len) {
                  stream.write(b, off, len);
                  byte[] chunk = new byte[len];
                  System.arraycopy(b, off, chunk, 0, len);
                  EmbeddedServerDebug.log("RX_CHUNK remote=" + remote + " bytes=" + len);
                  EmbeddedServerDebug.log("RX_CHUNK_HEX remote=" + remote + " hex=" + EmbeddedServerDebug.hex(chunk));
              }

              void logStream() {
                  byte[] all = stream.toByteArray();
                  EmbeddedServerDebug.log("RX_STREAM remote=" + remote + " bytes=" + all.length);
                  EmbeddedServerDebug.log("RX_STREAM_HEX remote=" + remote + " hex=" + EmbeddedServerDebug.hex(all));
              }

              @Override public void close() throws IOException {
                  try { delegate.close(); } finally { logStream(); }
              }

              @Override public int available() throws IOException { return delegate.available(); }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/mcvl/android/EmbeddedLocalServer.java")
          s = p.read_text(encoding="utf-8")
          original_input = "socket.getInputStream()"
          wrapped_input = "new MCVLChunkInputStream(socket.getInputStream(), String.valueOf(socket.getRemoteSocketAddress()))"
          if original_input not in s:
              raise SystemExit("PATCH_NOT_FOUND: socket.getInputStream()")
          s = s.replace(original_input, wrapped_input, 1)

          patches = [
              ("public static synchronized void start(Context context) {",
               "public static synchronized void start(Context context) {\n        EmbeddedServerDebug.init(context);\n        EmbeddedServerDebug.log(\"start() called\");"),
              ("serverSocket = new ServerSocket(PORT, 32, InetAddress.getByName(HOST));",
               "serverSocket = new ServerSocket(PORT, 32, InetAddress.getByName(HOST));\n            EmbeddedServerDebug.log(\"SERVER_STARTED port=\" + PORT);"),
              ("t.setDaemon(true);\n                t.start();",
               "t.setDaemon(true);\n                EmbeddedServerDebug.log(\"CLIENT_ACCEPT remote=\" + socket.getRemoteSocketAddress());\n                t.start();"),
              ("byte[] frame = readFrame(in);\n                if (frame == null) break;",
               "byte[] frame = readFrame(in);\n                if (frame == null) { EmbeddedServerDebug.log(\"CLIENT_EOF\"); break; }\n                EmbeddedServerDebug.log(\"RX_FRAME bytes=\" + frame.length);\n                EmbeddedServerDebug.log(\"RX_FRAME_HEX=\" + EmbeddedServerDebug.hex(frame));"),
              ("response = handleFrame(frame, socket);",
               "response = handleFrame(frame, socket);\n                    EmbeddedServerDebug.log(\"FRAME_HANDLED packets=\" + response.packets.size() + \" session=\" + (response.session != null));"),
              ("int pid = pk.readUnsignedShort();",
               "int pid = pk.readUnsignedShort();\n            EmbeddedServerDebug.log(\"RX_PACKET pid=\" + pid + \" session=\" + (sess != null) + \" payload_bytes=\" + pk.available() + \" packet_hex=\" + EmbeddedServerDebug.hex(packet));"),
              ("private void writeResponse(DataOutputStream out, PacketList response) throws IOException {",
               "private void writeResponse(DataOutputStream out, PacketList response) throws IOException {\n        StringBuilder dbg = new StringBuilder(\"TX_RESPONSE packets=\").append(response.packets.size());\n        for (Packet p : response.packets) { dbg.append(\" [\").append(p.pid).append(p.error ? \":ERR\" : \"\").append(\",\").append(p.data.length).append(\"]\"); EmbeddedServerDebug.log(\"TX_PACKET pid=\" + p.pid + \" error=\" + p.error + \" data_hex=\" + EmbeddedServerDebug.hex(p.data)); }\n        EmbeddedServerDebug.log(dbg.toString());"),
          ]
          for old, new in patches:
              if old not in s:
                  raise SystemExit("PATCH_NOT_FOUND: " + old.splitlines()[0])
              s = s.replace(old, new, 1)
          # PID 2001 map payload uses DataInputStream.readUTF() on the client.
          # DataOutputStream.writeUTF() is the matching modified-UTF encoder; raw UTF-8
          # shifts every field after a non-ASCII map name and leaves the client on loading.
          old_utf = 'W utf(String s)throws IOException{byte[]d=s.getBytes(StandardCharsets.UTF_8);o.writeShort(d.length);o.write(d);return this;}'
          new_utf = 'W utf(String s)throws IOException{o.writeUTF(s);return this;}'
          if old_utf not in s:
              raise SystemExit("PATCH_NOT_FOUND: W.utf UTF-8 serializer")
          s = s.replace(old_utf, new_utf, 1)
          print("PATCH_APPLIED: W.utf now matches DataInputStream.readUTF")

          # Align the PID 2001 trailer with f.h(DataInputStream):
          # after the three layer-counts, the parser reads an index-count short,
          # then a second short for the z-array count, then c(in)'s one-byte mode,
          # then the spawn-index short. There is no UTF string after this field.
          old_tail = 'w.s16(0).s16(0).s8(0).s16(c.ty*MAP_W+c.tx).utf("");'
          new_tail = 'w.s16(0).s16(0).s8(0).s16(c.ty*MAP_W+c.tx);'
          if old_tail in s:
              s = s.replace(old_tail, new_tail, 1)
              print("PATCH_APPLIED: PID 2001 trailer now has index-count, z-count, mode, spawn-index")
          elif new_tail in s:
              print("PATCH_ALREADY_APPLIED: PID 2001 trailer matches f.h() parser")
          else:
              raise SystemExit("PATCH_NOT_FOUND: PID 2001 map trailer alignment")

          # Restore the 1026 FASTSTART handler.
          marker = "private static final int P_VERSION = 9950;"
          inject = "\n".join([
              "private static final int P_VERSION = 9950;",
              "    private static final int P_FASTSTART = 1026;"
          ])
          if marker not in s:
              raise SystemExit("PATCH_NOT_FOUND: P_VERSION constant")
          s = s.replace(marker, inject, 1)

          marker = "            case P_VERSION: return hVersion();"
          inject = "\n".join([
              "            case P_VERSION: return hVersion();",
              "            case P_FASTSTART: return hFastStart(pk, local);"
          ])
          if marker not in s:
              raise SystemExit("PATCH_NOT_FOUND: dispatch P_VERSION")
          s = s.replace(marker, inject, 1)

          marker = "    private PacketResult hVersion() throws IOException {"
          inject = "\n".join([
              "    private PacketResult hFastStart(DataInputStream pk, Socket local) throws IOException {",
              "        String requestedName = readUtf(pk);",
              "        int gender = pk.readByte();",
              "        int cls = pk.readByte();",
              "        int c1 = pk.readInt();",
              "        int c2 = pk.readInt();",
              "        int style = pk.readByte();",
              "        int id = store.nextPid++;",
              "        String acct = \"guest\" + id;",
              "        String pwd = \"local\";",
              "        Account a = new Account(); a.pwd = pwd; a.chars = new CharData[2];",
              "        CharData ch = new CharData();",
              "        ch.name = \"Khach\" + id; ch.cls = cls; ch.gender = gender;",
              "        ch.c1 = c1; ch.c2 = c2; ch.style = style; ch.pid = id;",
              "        ch.level = 1; ch.gold = 1000; ch.exp = 0; ch.map = 0; ch.tx = SPAWN_TX; ch.ty = SPAWN_TY;",
              "        a.chars[0] = ch; store.accounts.put(acct, a); store.save();",
              "        String token = \"s_\" + Long.toHexString(RNG.nextLong()) + Long.toHexString(RNG.nextLong());",
              "        Session session = new Session(token, acct, local);",
              "        sessions.put(token, session); bySid.put(session.sid, session);",
              "        W w = new W().utf(ch.name).utf(token).utf(HOST + \":\" + PORT).utf(\"Chào mừng!\").utf(\"Local Server\").utf(acct).utf(pwd);",
              "        w.s8(0).s16(51).s16(68);",
              "        PacketResult result = ok(P_FASTSTART, w.bytes()); result.session = session;",
              "        EmbeddedServerDebug.log(\"FASTSTART_SESSION_CREATED account=\" + acct + \" token_len=\" + token.length() + \" sid=\" + session.sid);",
              "        return result;",
              "    }",
              "",
              "    private PacketResult hVersion() throws IOException {"
          ])
          if marker not in s:
              raise SystemExit("PATCH_NOT_FOUND: hVersion")
          s = s.replace(marker, inject, 1)

          # Log unsupported protocol packets instead of silently swallowing them.
          dispatch_marker = "            default: return new PacketResult();"
          dispatch_replacement = "            default: EmbeddedServerDebug.log(\"UNHANDLED_PID pid=\" + pid + \" remaining_bytes=\" + pk.available()); return new PacketResult();"
          if dispatch_marker not in s:
              raise SystemExit("PATCH_NOT_FOUND: dispatch default")
          s = s.replace(dispatch_marker, dispatch_replacement, 1)

          # Port V11's exact Python-seeded tile array into Java; Java Random is not
          # compatible with Python random.Random and previously generated a different map.
          import random
          import re
          w, h = 64, 48
          rnd = random.Random(1234)
          tiles = []
          for y in range(h):
              for x in range(w):
                  tiles.append(rnd.choice(list(range(1, 10))) if rnd.random() < 0.85 else rnd.choice(list(range(10, 17))))
          block = 0x8000
          for x in range(w):
              for y in (0, 1, h - 2, h - 1): tiles[y*w+x] = 17 | block
          for y in range(h):
              for x in (0, 1, w - 2, w - 1): tiles[y*w+x] = 18 | block
          cx, cy = w // 2, h // 2 - 4
          for y in range(h):
              for x in range(w):
                  dx, dy = (x-cx)/9.0, (y-cy)/5.0
                  if dx*dx + dy*dy <= 1.0: tiles[y*w+x] = 37 | block
          for x in range(2, w-2):
              for y in (h-8, h-7): tiles[y*w+x] = 51 + (x % 3)
          tile_method = "    private static int[] buildMapTiles() { return new int[]{" + ",".join(map(str, tiles)) + "}; }"
          s, tile_count = re.subn(r"    private static int\[\] buildMapTiles\(\)\s*\{.*?\n    \}", tile_method, s, count=1, flags=re.S)
          if tile_count != 1:
              raise SystemExit("PATCH_NOT_FOUND: buildMapTiles")

          # Make the client-side map request/completion subcommands observable.
          move_marker = "        int sub = pk.readByte();"
          move_replacement = "        int sub = pk.readByte(); EmbeddedServerDebug.log(\"MOVE_SUB sub=\" + sub + \" session=\" + (s != null) + \" char=\" + (s != null && s.ch != null) + \" remaining=\" + pk.available());"
          if move_marker not in s:
              raise SystemExit("PATCH_NOT_FOUND: hMove subcommand")
          s = s.replace(move_marker, move_replacement, 1)

          # Match V11 encode_response(): an empty packet list has a zero-length
          # payload, not a two-byte packet-count field containing 0.
          old_empty = "        body.writeShort(response.packets.size());"
          new_empty = "        if (!response.packets.isEmpty()) body.writeShort(response.packets.size());"
          if old_empty not in s:
              raise SystemExit("PATCH_NOT_FOUND: empty response framing")
          s = s.replace(old_empty, new_empty, 1)

          # Verify the exact trailer order expected by f.h(DataInputStream):
          # index count (short), z-array count (short), c(in) mode (byte),
          # spawn index (short). The parser does not read a UTF string here.
          old_tail = 'w.s16(0).s16(0).s8(0).s16(c.ty*MAP_W+c.tx).utf("");'
          new_tail = 'w.s16(0).s16(0).s8(0).s16(c.ty*MAP_W+c.tx);'
          if old_tail in s:
              s = s.replace(old_tail, new_tail, 1)
              print("PATCH_APPLIED: corrected PID 2001 trailer field sequence")
          elif new_tail in s:
              print("PATCH_ALREADY_APPLIED: corrected PID 2001 trailer")
          else:
              raise SystemExit("PATCH_NOT_FOUND: PID 2001 trailer")
          if old_tail in s or 'w.s16(0).s8(0).s16(c.ty*MAP_W+c.tx).utf("");' in s:
              raise SystemExit("PATCH_VERIFY_FAILED: stale PID 2001 trailer remains")
          if new_tail not in s:
              raise SystemExit("PATCH_VERIFY_FAILED: expected PID 2001 trailer not found")
          print("PATCH_VERIFIED: index-count, z-count, mode, spawn-index")

          # Fail the CI build if the PID 2001 serializer drifts from the
          # client parser's field order. These checks run against the patched Java source.
          if 'W utf(String s)throws IOException{o.writeUTF(s);return this;}' not in s:
              raise SystemExit("PROTOCOL_CHECK_FAILED: PID 2001 strings must use DataOutputStream.writeUTF")
          expected_map = 'w.s8(1).s32(1).s32(0).s16(0).s16(0).s16(0).utf("Đồng cỏ khởi đầu").s8(0).s8(0).s16(SPAWN_TY*MAP_W+SPAWN_TX).s16(0);'
          if expected_map not in s:
              raise SystemExit("PROTOCOL_CHECK_FAILED: PID 2001 header field order changed")
          expected_tiles = 'w.s16(0).s8(MAP_H).s8(MAP_W).s8(1); for(int t:mapTiles)w.s16(t); w.s16(0); for(int i=0;i<3;i++)w.s16(0); w.s16(0).s16(0).s8(0).s16(c.ty*MAP_W+c.tx);'
          if expected_tiles not in s:
              raise SystemExit("PROTOCOL_CHECK_FAILED: PID 2001 dimensions/tile/trailer order changed")
          if 'w.s16(0).s16(0).s8(0).s16(c.ty*MAP_W+c.tx).utf("");' in s:
              raise SystemExit("PROTOCOL_CHECK_FAILED: extra short remains before PID 2001 trailer flag")
          print("PROTOCOL_CHECK_PASS: PID 2001 header, dimensions, tile array, trailer and modified UTF")
          p.write_text(s, encoding="utf-8")
          print("Debug instrumentation injected successfully.")
          PY

      - name: Build APK
        working-directory: source/mcvl-android-source/mcvl-android
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: Verify APK
        working-directory: source/mcvl-android-source/mcvl-android
        run: |
          APK=out/MinhChuVoLam-2.0.3.apk
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCVL-2.0.3-embedded-server-debug
          path: source/mcvl-android-source/mcvl-android/out/MinhChuVoLam-2.0.3.apk
          if-no-files-found: error
          retention-days: 30

# Re-triggered build to verify the embedded-server Android toolchain and APK artifact.
