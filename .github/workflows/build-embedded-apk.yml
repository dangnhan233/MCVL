name: Build MCVL Embedded Local Server APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip"
      - ".github/workflows/build-embedded-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          test -f MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip
          unzip -t MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip >/dev/null

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

      - name: Extract source
        id: extract
        run: |
          rm -rf source
          mkdir source
          unzip -q MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip -d source
          BUILD_SH=$(find source -type f -name build_apk.sh -print -quit)
          test -n "$BUILD_SH"
          SRC_DIR=$(dirname "$BUILD_SH")
          echo "Source directory: $SRC_DIR"
          echo "src_dir=$SRC_DIR" >> "$GITHUB_OUTPUT"

      - name: Inject MCVL server debug logging
        working-directory: source/mcvl-android-source/mcvl-android
        run: |
          DEBUG_DIR=app/src/main/java/com/mcvl/android
          cat > "$DEBUG_DIR/EmbeddedServerDebug.java" <<'EOF'
          package com.mcvl.android;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          final class EmbeddedServerDebug {
              private static Context app;
              private static Uri uri;
              private static Uri rootUri;
              private static String name;

              static synchronized void init(Context context) {
                  if (app != null) return;
                  app = context.getApplicationContext();
                  try {
                      name = "MCVL_SERVER_DEBUG_" +
                              new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) +
                              ".log";
                      ContentResolver cr = app.getContentResolver();
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                      if (Build.VERSION.SDK_INT >= 29) {
                          cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/mcvl_debug");
                          cv.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      }
                      uri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                      ContentValues root = new ContentValues();
                      root.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      root.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                      if (Build.VERSION.SDK_INT >= 29) {
                          root.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download");
                          root.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      }
                      rootUri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, root);
                      if (uri == null) {
                          ContentValues fallback = new ContentValues();
                          fallback.put(MediaStore.MediaColumns.DISPLAY_NAME, "MCVL_SERVER_DEBUG_FALLBACK_" +
                                  new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".log");
                          fallback.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                          if (Build.VERSION.SDK_INT >= 29) {
                              fallback.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download");
                              fallback.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          }
                          uri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, fallback);
                      }
                  } catch (Throwable t) {
                      android.util.Log.e("MCVL_DEBUG", "init failed", t);
                  }
                  log("=== MCVL EMBEDDED SERVER DEBUG START ===");
                  log("android=" + Build.VERSION.RELEASE + " sdk=" + Build.VERSION.SDK_INT);
                  log("endpoint=127.0.0.1:9001");
              }

              static synchronized void log(String message) {
                  String line = System.currentTimeMillis() + " " + message + "\n";
                  android.util.Log.i("MCVL_DEBUG", message);
                  if (app == null || (uri == null && rootUri == null)) {
                      return;
                  }
                  try {
                      if (uri != null) {
                          OutputStream out = app.getContentResolver().openOutputStream(uri, "wa");
                          if (out != null) { out.write(line.getBytes(StandardCharsets.UTF_8)); out.close(); }
                      }
                      if (rootUri != null) {
                          OutputStream out = app.getContentResolver().openOutputStream(rootUri, "wa");
                          if (out != null) { out.write(line.getBytes(StandardCharsets.UTF_8)); out.close(); }
                      }
                  } catch (Throwable t) {
                      android.util.Log.e("MCVL_DEBUG", "write failed: " + line, t);
                  }
              }

              static String hex(byte[] data) {
                  if (data == null) return "";
                  StringBuilder sb = new StringBuilder(data.length * 2);
                  for (byte b : data) sb.append(String.format(Locale.US, "%02X", b & 0xFF));
                  return sb.toString();
              }

              static synchronized void error(String where, Throwable t) {
                  log("ERROR " + where + " " + t.getClass().getName() + ": " + String.valueOf(t.getMessage()));
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/mcvl/android/EmbeddedLocalServer.java")
          s = p.read_text(encoding="utf-8")

          patches = [
              ("public static synchronized void start(Context context) {",
               "public static synchronized void start(Context context) {\n        EmbeddedServerDebug.init(context);\n        EmbeddedServerDebug.log(\"start() called\");"),
              ("serverSocket = new ServerSocket(PORT, 32, InetAddress.getByName(HOST));",
               "serverSocket = new ServerSocket(PORT, 32, InetAddress.getByName(HOST));\n            EmbeddedServerDebug.log(\"SERVER_STARTED port=\" + PORT);"),
              ("t.setDaemon(true);\n                t.start();",
               "t.setDaemon(true);\n                EmbeddedServerDebug.log(\"CLIENT_ACCEPT remote=\" + socket.getRemoteSocketAddress());\n                t.start();"),
              ("byte[] frame = readFrame(in);\n                if (frame == null) break;",
               "byte[] frame = readFrame(in);\n                if (frame == null) { EmbeddedServerDebug.log(\"CLIENT_EOF\"); break; }\n                EmbeddedServerDebug.log(\"RX_FRAME bytes=\" + frame.length);\n                EmbeddedServerDebug.log(\"RX_FRAME_HEX=\" + EmbeddedServerDebug.hex(frame));"),
              ("response = handleFrame(frame, socket);",
               "response = handleFrame(frame, socket);\n                    EmbeddedServerDebug.log(\"FRAME_HANDLED packets=\" + response.packets.size() + \" session=\" + (response.session != null));"),
              ("int pid = pk.readUnsignedShort();",
               "int pid = pk.readUnsignedShort();\n            EmbeddedServerDebug.log(\"RX_PACKET pid=\" + pid + \" session=\" + (sess != null));"),
              ("private void writeResponse(DataOutputStream out, PacketList response) throws IOException {",
               "private void writeResponse(DataOutputStream out, PacketList response) throws IOException {\n        StringBuilder dbg = new StringBuilder(\"TX_RESPONSE packets=\").append(response.packets.size());\n        for (Packet p : response.packets) dbg.append(\" [\").append(p.pid).append(p.error ? \":ERR\" : \"\").append(\",\").append(p.data.length).append(\"]\");\n        EmbeddedServerDebug.log(dbg.toString());"),
          ]
          for old, new in patches:
              if old not in s:
                  raise SystemExit("PATCH_NOT_FOUND: " + old.splitlines()[0])
              s = s.replace(old, new, 1)
          # Restore the 1026 FASTSTART handler.
          marker = "private static final int P_VERSION = 9950;"
          inject = """private static final int P_VERSION = 9950;
    private static final int P_FASTSTART = 1026;"""
          if marker not in s:
              raise SystemExit("PATCH_NOT_FOUND: P_VERSION constant")
          s = s.replace(marker, inject, 1)

          marker = "            case P_VERSION: return hVersion();"
          inject = """            case P_VERSION: return hVersion();
            case P_FASTSTART: return hFastStart(pk);"""
          if marker not in s:
              raise SystemExit("PATCH_NOT_FOUND: dispatch P_VERSION")
          s = s.replace(marker, inject, 1)

          marker = "    private PacketResult hVersion() throws IOException {"
          inject = """    private PacketResult hFastStart(DataInputStream pk) throws IOException {
        while (pk.available() > 0) pk.readUnsignedByte();
        W w = new W();
        w.utf("").utf("").utf(HOST + ":" + PORT);
        w.utf("").utf("").utf("").utf("");
        w.s8(1).s8(0).s16(51).s16(68);
        return ok(P_FASTSTART, w.bytes());
    }

    private PacketResult hVersion() throws IOException {"""
          if marker not in s:
              raise SystemExit("PATCH_NOT_FOUND: hVersion")
          s = s.replace(marker, inject, 1)

          p.write_text(s, encoding="utf-8")
          print("Debug instrumentation injected successfully.")
          PY

      - name: Build APK
        working-directory: source/mcvl-android-source/mcvl-android
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: Verify APK
        working-directory: source/mcvl-android-source/mcvl-android
        run: |
          APK=out/MinhChuVoLam-2.0.3.apk
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCVL-2.0.3-embedded-server-debug
          path: source/mcvl-android-source/mcvl-android/out/MinhChuVoLam-2.0.3.apk
          if-no-files-found: error
          retention-days: 30
