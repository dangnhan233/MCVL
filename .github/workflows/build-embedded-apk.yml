name: Build MCVL Embedded Local Server APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip"
      - ".github/workflows/build-embedded-apk.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          test -f MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip
          unzip -t MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip >/dev/null

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract source
        run: |
          rm -rf source
          mkdir source
          unzip -q MCVL_EMBEDDED_LOCAL_SERVER_SOURCE-1.zip -d source
          test -f source/mcvl-android-source/build_apk.sh

      - name: Build APK
        working-directory: source/mcvl-android-source
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: Verify APK
        working-directory: source/mcvl-android-source
        run: |
          test -f out/MinhChuVoLam-2.0.3.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose out/MinhChuVoLam-2.0.3.apk
          sha256sum out/MinhChuVoLam-2.0.3.apk
          ls -lh out/MinhChuVoLam-2.0.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCVL-2.0.3-embedded-server
          path: source/mcvl-android-source/out/MinhChuVoLam-2.0.3.apk
          if-no-files-found: error
          retention-days: 30
